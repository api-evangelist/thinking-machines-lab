aid: thinking-machines-lab
name: Thinking Machines Lab
description: >-
  Thinking Machines Lab is an AI research company (founded by Mira Murati) whose
  first product is Tinker — a cloud training API for researchers and developers.
  Tinker gives you full control over your data, algorithms, and models while it
  manages the GPU infrastructure: you author training loops locally with four
  primitives (forward_backward, optim_step, sample, save_state) and Tinker runs
  distributed LoRA fine-tuning across dense and Mixture-of-Experts models from 1B
  to 1T+ parameters. It supports SFT, reinforcement learning (GRPO, PPO), DPO, and
  distillation, shipped as an official Python SDK (tinker) plus the tinker-cookbook
  of recipes, a web console/playground, and OAuth 2.0 / OIDC authentication.
